# Git Safety Policy
# Prevents dangerous git operations by agents.

name: git-safety
description: Prevents dangerous git operations by agents

rules:
  - name: block-force-push
    when: tool.before
    match:
      - field: toolName
        pattern:
          - "Bash"
          - "bash"
          - "terminal"
          - "shell"
      - field: input.command
        pattern:
          - "*push --force*"
          - "*push -f*"
    action: modify
    feedback: "Force push is not allowed. Use regular push or push with lease."
    modifiedInput:
      command: "git push --force-with-lease"
    suggestions:
      - "Use git push --force-with-lease instead"

  - name: block-hard-reset
    when: tool.before
    match:
      - field: toolName
        pattern:
          - "Bash"
          - "bash"
          - "terminal"
          - "shell"
      - field: input.command
        pattern: "*reset --hard*"
    action: deny
    feedback: "git reset --hard is not allowed. This discards uncommitted changes permanently."
    suggestions:
      - "Use git stash instead"
      - "Use git checkout to discard specific files"

  - name: block-main-push
    when: tool.before
    match:
      - field: toolName
        pattern:
          - "Bash"
          - "bash"
          - "terminal"
          - "shell"
      - field: input.command
        pattern:
          - "*push*main*"
          - "*push*master*"
    action: deny
    feedback: "Direct push to main/master is not allowed. Use feature branches and pull requests."
    suggestions:
      - "Create a feature branch"
      - "Use pull requests for code review"
