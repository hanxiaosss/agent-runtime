# Codex CLI configuration
# Generated by hannah init

# Hooks: lifecycle event handlers for agent governance.
# The handler evaluates policies and semantic rules, writes traces,
# and communicates decisions via exit code (0=allow, 2=deny).

[[hooks.PreToolUse]]
matcher = "*"
command = "node dist/hooks/codex-handler.js pre-tool-use"

[[hooks.PostToolUse]]
matcher = "*"
command = "node dist/hooks/codex-handler.js post-tool-use"

[[hooks.Stop]]
matcher = ""
command = "node dist/hooks/codex-handler.js stop"
